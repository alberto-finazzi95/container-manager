name: Build and publish container

on:
  push:
    tags:
      - '**'

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: ai-decisional-tree-container
            dockerfile: docker/python314.Dockerfile
            requirements_repository: alberto-finazzi95/AI-Decisional-Tree
            requirements_ref: feature/pipeline-developement
            requirements_path: requirements-lock.txt
            requirements_file: dependencies/requirements-lock.txt
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Checkout requirements
        if: ${{ matrix.requirements_repository != '' }}
        uses: actions/checkout@v6
        with:
          repository: ${{ matrix.requirements_repository }}
          ref: ${{ matrix.requirements_ref }}
          path: dependencies
          sparse-checkout: ${{ matrix.requirements_path }}
          sparse-checkout-cone-mode: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1 for security issue

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4 for security issue
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.image }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0 for security issue
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: |
            REQUIREMENTS_FILE=${{ matrix.requirements_file || 'requirements.txt' }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:latest
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ github.ref_name }}
